[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "*/migrations/*",
    "badwords",
    "website/media",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ограничиваем через line-length
    "B008",  # вызов функции в дефолте — Django/DRF паттерн
]

[tool.ruff.lint.per-file-ignores]
"website/**/tests/*" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | migrations
  | badwords
)/
'''

[tool.isort]
profile = "black"
line_length = 110
skip_glob = [
    "*/migrations/*",
    "badwords/*",
]